        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.update();
                    }, 10);
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }

var activeCrossingLayer = layer_RailCrossingsIncidents_4;
map.addLayer(activeCrossingLayer);

// Switch function: remove all layers first, then add the selected one
function switchCrossingLayer(newLayer) {
    for (var key in crossingLayers) {
        if (map.hasLayer(crossingLayers[key])) {
            map.removeLayer(crossingLayers[key]);
        }
    }
    map.addLayer(newLayer);
    activeCrossingLayer = newLayer;
}


var crossingControl = L.control({position: 'topright'});

crossingControl.onAdd = function () {
    // main container
    var div = L.DomUtil.create('div', 'info legend leaflet-control-crossing');
    div.innerHTML = '<strong>At-Grade Railroad Crossings</strong><br>';


    for (var name in crossingLayers) {
        var label = document.createElement('label');

        var input = document.createElement('input');
        input.type = 'radio';
        input.name = 'At-Grade Railroad Crossings';
        input.value = name;

        if(name === "Incidents (2015–2025)") input.checked = true;

        input.addEventListener('change', function(e){
            switchCrossingLayer(crossingLayers[e.target.value]);
        });

        label.appendChild(input);
        label.appendChild(document.createTextNode(name));
        div.appendChild(label);
    }
    return div;
};

crossingControl.addTo(map);

        setBounds();
map.setZoom(map.getZoom() + 2);
map.panBy([0, 300]);
        </script>        
    </body>
</html>
